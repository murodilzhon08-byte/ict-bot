name: ICT backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Неча кунлик тарих (масалан 90)"
        required: true
        default: "90"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Backtest
        env:
          DAYS: ${{ inputs.days }}
          SYMBOLS: ${{ vars.SYMBOLS }}
        run: python backtest.py
